[project]
name = "perch"
version = "0.1.0"
description = "See every route to fund your work."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "lancedb==0.40.0",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "pypdf==6.1.3",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[project.scripts]
perch = "perch.cli:main"

[project.optional-dependencies]
ml = [
    "sentence-transformers==6.2.0",
    "torch==2.14.1",
]
anthropic = [
    "anthropic==2.3.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perch"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/render_tracker.py" = ["E501"]  # inline CSS
"scripts/ux_walk.py" = ["E501"]  # inline JavaScript probes
"scripts/tour/animate.py" = ["ANN", "E501", "B905"]  # copied unchanged from NextTex

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# The lab node's driver (565.57.01) supports CUDA 12.7; default torch wheels need CUDA 13.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
