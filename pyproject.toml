[project]
name = "perch"
version = "0.1.0"
description = "See every route to fund your work."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.1",
]

[project.scripts]
perch = "perch.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perch"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/render_tracker.py" = ["E501"]  # inline CSS

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
