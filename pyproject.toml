[project]
name = "perch"
version = "1.0.0"
description = "See every route to fund your work."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==46.0.3",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "lancedb==0.40.0",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.7",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.1",
    "pypdf==6.21.4",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
    "redis==6.4.0",
]

[project.scripts]
perch = "perch.cli:main"

[project.optional-dependencies]
ml = [
    "sentence-transformers==6.2.0",
    "torch==2.14.1",
]
anthropic = [
    "anthropic==2.3.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perch"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"tests/test_key_ops*.py" = ["ANN", "F811"]  # imported pytest fixtures
"bench/load/**" = ["ANN"] # load-test harness: wraps and patches perch objects at run time
"scripts/render_tracker.py" = ["E501"]  # inline CSS
"scripts/ux_walk.py" = ["E501"]  # inline JavaScript probes
"scripts/live_capture.py" = ["E501", "ANN"]  # a one-off capture script with long report lines
"scripts/cost_model.py" = ["E501"]  # cited price sources and their URLs
"scripts/tour/animate.py" = ["ANN", "E501", "B905"]  # copied unchanged from NextTex
"scripts/tour/demo_films.py" = ["E501", "B905"]  # a film driver with inline JavaScript and captions

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# The lab node's driver (565.57.01) supports CUDA 12.7; default torch wheels need CUDA 13.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
