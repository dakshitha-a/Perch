<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" class="arch" role="img" font-family="system-ui, sans-serif" aria-label="How Perch v1 fits together. A browser talks to a stateless web app. The web app reads Postgres with pgvector, keeps sessions and counters in Redis, and puts jobs on a queue in Postgres. Sign-in goes through an OpenID Connect server; guests need no account. A worker on one GPU takes the jobs. Its pipeline is plain code: retrieval with a local embedder, eligibility rules, a local reranker, and student and citizenship rules. Cloud models from Anthropic write the profile summary, fit explanations, hand-off openings, application points and Scout answers. Every model output passes the citation validator, whose second layer is a local MiniCheck model. User data is stored encrypted with per-user keys held in a separate keys database. The app sends nothing to anyone.">
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-size="12" fill="currentColor">
    <rect x="20" y="12" width="22" height="14" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code"/>
    <text x="48" y="23">plain code, no model</text>
    <rect x="200" y="12" width="22" height="14" rx="3" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
    <text x="228" y="23">small model on the worker's GPU</text>
    <rect x="450" y="12" width="22" height="14" rx="3" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
    <text x="478" y="23">cloud model (Anthropic)</text>
  </g>

  <g font-size="11" fill="currentColor" opacity="0.7" font-weight="600" letter-spacing="0.06em">
    <text x="20" y="58">REQUEST PATH</text>
    <text x="20" y="262">STORAGE</text>
    <text x="20" y="400">WORKER · ONE GPU · THE PIPELINE</text>
    <text x="20" y="640">MODELS · BOUNDED</text>
    <text x="20" y="772">WHAT THE USER SEES</text>
  </g>

  <!-- request path -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code">
    <rect x="20" y="68" width="200" height="70" rx="6"/>
    <rect x="260" y="68" width="200" height="70" rx="6"/>
    <rect x="500" y="68" width="200" height="70" rx="6"/>
    <rect x="260" y="168" width="200" height="60" rx="6"/>
    <rect x="500" y="168" width="200" height="60" rx="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="currentColor">
    <text x="32" y="92">Browser</text>
    <text x="272" y="92">Web app</text>
    <text x="512" y="92">Sign-in server</text>
    <text x="272" y="192">Job queue</text>
    <text x="512" y="192">Guest session</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.8">
    <text x="32" y="110">signed in, or as a guest</text>
    <text x="32" y="126">reached over public HTTPS</text>
    <text x="272" y="110">stateless, checks every request</text>
    <text x="272" y="126">never loads a model</text>
    <text x="512" y="110">OpenID Connect, PKCE</text>
    <text x="512" y="126">holds the passwords, not Perch</text>
    <text x="272" y="210">a table in Postgres, ids only</text>
    <text x="512" y="210">no account, nothing saved</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M220 103 H258"/>
    <path d="M460 103 H498"/>
    <path d="M360 138 V166"/>
  </g>

  <!-- storage -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code">
    <rect x="20" y="272" width="220" height="100" rx="6"/>
    <rect x="250" y="272" width="220" height="100" rx="6"/>
    <rect x="480" y="272" width="220" height="100" rx="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="currentColor">
    <text x="32" y="294">Postgres with pgvector</text>
    <text x="262" y="294">Redis</text>
    <text x="492" y="294">Keys database</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.8">
    <text x="32" y="313">public records with source,</text>
    <text x="32" y="328">link and fetch time; the job table;</text>
    <text x="32" y="343">user rows as encrypted blobs</text>
    <text x="32" y="358">row-level security by role</text>
    <text x="262" y="313">sessions, rate limits, spend counters</text>
    <text x="262" y="328">guest results, sealed, one hour</text>
    <text x="492" y="313">one wrapped data key per user</text>
    <text x="492" y="328">separate database and role</text>
    <text x="492" y="343">a shred leaves a tombstone</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M260 198 H130 V270"/>
  </g>

  <!-- worker / pipeline -->
  <rect x="20" y="410" width="680" height="214" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="5 3"/>
  <g font-size="12" fill="currentColor" font-weight="600"><text x="32" y="430">Worker: takes a job from the queue and runs it</text></g>
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code">
    <rect x="276" y="444" width="150" height="62" rx="6"/>
    <rect x="32" y="540" width="150" height="72" rx="6"/>
    <rect x="276" y="540" width="150" height="72" rx="6"/>
    <rect x="520" y="540" width="168" height="72" rx="6"/>
  </g>
  <rect x="32" y="444" width="150" height="62" rx="6" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <rect x="520" y="444" width="168" height="62" rx="6" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <g font-size="12" font-weight="600" fill="currentColor">
    <text x="42" y="464">1 Retrieve</text>
    <text x="286" y="464">2 Eligibility rules</text>
    <text x="530" y="464">3 Rerank</text>
    <text x="42" y="560">4 Student rules</text>
    <text x="286" y="560">5 Citizenship picks</text>
    <text x="530" y="560">6 Build the lead list</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.85">
    <text x="42" y="480">embedder, dense</text>
    <text x="42" y="494">top 200 by meaning</text>
    <text x="286" y="480">dates, applicant type,</text>
    <text x="286" y="494">level, notices</text>
    <text x="530" y="480">reranker scores 100,</text>
    <text x="530" y="494">keeps 10</text>
    <text x="42" y="577">class year, school, level;</text>
    <text x="42" y="591">every rule leaves a line</text>
    <text x="286" y="577">optional pick vs the</text>
    <text x="286" y="591">listing's own words;</text>
    <text x="286" y="605">moves it lower, never drops</text>
    <text x="530" y="577">numbers and dates copied</text>
    <text x="530" y="591">from record fields, with</text>
    <text x="530" y="605">source link on every row</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M182 475 H274"/><path d="M426 475 H518"/>
    <path d="M604 506 V523 H107 V538" />
    <path d="M182 576 H274"/><path d="M426 576 H518"/>
    <path d="M360 372 V408"/>
  </g>

  <!-- models -->
  <rect x="20" y="650" width="210" height="100" rx="6" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
  <rect x="240" y="650" width="260" height="100" rx="6" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
  <rect x="510" y="650" width="190" height="100" rx="6" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <g font-size="13" font-weight="600" fill="currentColor">
    <text x="32" y="672">Haiku 5.5</text>
    <text x="252" y="672">Sonnet 5.5</text>
    <text x="522" y="672">Citation validator</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.85">
    <text x="32" y="690">scope gate, profile summary,</text>
    <text x="32" y="705">Temple page extraction</text>
    <text x="32" y="720">(extraction runs offline)</text>
    <text x="252" y="690">fit explanations, hand-off opening,</text>
    <text x="252" y="705">application points, Scout answers</text>
    <text x="252" y="720">Scout calls read-only tools only</text>
    <text x="522" y="690">layer 1: code checks ids,</text>
    <text x="522" y="705">numbers, dates, links</text>
    <text x="522" y="720">layer 2: MiniCheck reads</text>
    <text x="522" y="735">each sentence; redo once</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M360 624 V648"/>
    <path d="M230 700 H238"/><path d="M500 700 H508"/>
  </g>

  <!-- result -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code">
    <rect x="20" y="782" width="680" height="70" rx="6"/>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="32" y="803" font-weight="600">Leads, each with its record, link and rule lines</text>
    <text x="32" y="822">A flagged sentence is marked, never hidden. The hand-off is a draft. Perch sends nothing.</text>
    <text x="32" y="840">Results go back through storage and the web app to the browser. No outside system is written to.</text>
  </g>
  <path d="M360 750 V780" stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)"/>
</svg>
