<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" class="arch" role="img" font-family="system-ui, sans-serif" aria-label="How Perch fits together. Public sources feed plain-code fetchers, which store every record with its provenance. A brief runs one side at a time. A researcher gets grants, with two small local models and eligibility rules, and industry leads, which are code only. A student gets a CV read by rule, then public fellowships and sample scholarships. A chat model writes the profile summary, the fit explanations, the hand-off opening and the cover-letter points. Scout answers follow-ups by calling only Perch's own tools. Every model output passes the validator before the web app shows it. Models are local by default; Cloud is used only by the user's choice after a warning. The MCP server offers Scout's researcher tools to other agents.">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2b2d"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-size="12" fill="#1f2b2d">
    <rect x="20" y="12" width="22" height="14" rx="3" fill="none" stroke="#1f2b2d" stroke-opacity="0.45" class="k-code"/>
    <text x="48" y="23">code, no model</text>
    <rect x="160" y="12" width="22" height="14" rx="3" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
    <text x="188" y="23">local model, stays local</text>
    <rect x="345" y="12" width="22" height="14" rx="3" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
    <text x="373" y="23">chat model; Cloud only if chosen</text>
    <rect x="590" y="12" width="22" height="14" rx="3" fill="none" stroke="#1f2b2d" stroke-opacity="0.4" stroke-dasharray="2 3"/>
    <text x="618" y="23">unavailable</text>
  </g>

  <g font-size="11" fill="#1f2b2d" opacity="0.7" font-weight="600" letter-spacing="0.06em">
    <text x="20" y="58">PUBLIC SOURCES · READ ONLY</text>
    <text x="20" y="300">A BRIEF</text>
    <text x="20" y="482">MODELS · BOUNDED</text>
    <text x="20" y="724">WHAT THE USER SEES</text>
  </g>

  <!-- sources -->
  <g fill="none" stroke="#1f2b2d" stroke-opacity="0.35" stroke-dasharray="5 3">
    <rect x="20" y="68" width="128" height="52" rx="6"/>
    <rect x="158" y="68" width="128" height="52" rx="6"/>
    <rect x="296" y="68" width="128" height="52" rx="6"/>
    <rect x="434" y="68" width="128" height="52" rx="6"/>
  </g>
  <rect x="572" y="68" width="128" height="52" rx="6" fill="none" stroke="#1f2b2d" stroke-opacity="0.25" stroke-dasharray="2 3"/>
  <g font-size="13" font-weight="600" fill="#1f2b2d">
    <text x="30" y="90">OpenAlex</text>
    <text x="168" y="90">NIH RePORTER</text>
    <text x="306" y="90">NSF Awards</text>
    <text x="444" y="90">Grants.gov</text>
    <text x="582" y="90" opacity="0.55">SBIR.gov</text>
  </g>
  <g font-size="11" fill="#1f2b2d" opacity="0.75">
    <text x="30" y="108">papers, companies</text>
    <text x="168" y="108">awards, SBIR/STTR</text>
    <text x="306" y="108">awards, dates</text>
    <text x="444" y="108">open, archived calls</text>
    <text x="582" y="108" opacity="0.7">API down, unused</text>
  </g>
  <g stroke="#1f2b2d" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M84 120 V148"/><path d="M222 120 V148"/><path d="M360 120 V148"/><path d="M498 120 V148"/>
  </g>

  <!-- fetchers and store -->
  <g fill="none" stroke="#1f2b2d" stroke-opacity="0.45" class="k-code">
    <rect x="20" y="150" width="680" height="50" rx="6"/>
    <rect x="20" y="226" width="680" height="50" rx="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1f2b2d">
    <text x="36" y="171">Fetchers</text>
    <text x="36" y="247">Store · SQLite records and a LanceDB search index</text>
  </g>
  <g font-size="11.5" fill="#1f2b2d" opacity="0.8">
    <text x="36" y="189">Rate-limited and retried. Each record keeps its source, link and fetch time. Numbers are copied.</text>
    <text x="36" y="265">Researchers, works, awards, opportunities, organisations, leads and briefs; embedding and rerank caches.</text>
  </g>
  <path d="M360 200 V224" stroke="#1f2b2d" stroke-opacity="0.6" fill="none" marker-end="url(#oa)"/>
  <g stroke="#1f2b2d" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M128 276 V308"/><path d="M360 276 V308"/><path d="M592 276 V308"/>
  </g>

  <!-- Route A -->
  <rect x="20" y="310" width="216" height="150" rx="6" fill="none" stroke="#1f2b2d" stroke-opacity="0.35"/>
  <text x="34" y="331" font-size="13" font-weight="600" fill="#1f2b2d">Researcher · grants</text>
  <rect x="32" y="340" width="192" height="34" rx="4" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <rect x="32" y="380" width="192" height="34" rx="4" fill="none" stroke="#1f2b2d" stroke-opacity="0.45" class="k-code"/>
  <rect x="32" y="420" width="192" height="34" rx="4" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <g font-size="11.5" fill="#1f2b2d">
    <text x="40" y="354">Embed papers into threads;</text><text x="40" y="368">search open calls</text>
    <text x="40" y="394">Eligibility rules on</text><text x="40" y="408">record fields</text>
    <text x="40" y="434">Rerank the closest calls</text><text x="40" y="448">to a top 10</text>
  </g>

  <!-- Route B -->
  <rect x="252" y="310" width="216" height="150" rx="6" fill="none" stroke="#1f2b2d" stroke-opacity="0.45" class="k-code"/>
  <text x="266" y="331" font-size="13" font-weight="600" fill="#1f2b2d">Researcher · industry</text>
  <g font-size="11.5" fill="#1f2b2d">
    <text x="266" y="353">Signals per company: papers</text>
    <text x="266" y="368">citing yours, NIH SBIR/STTR</text>
    <text x="266" y="383">awards, papers on the topic</text>
    <text x="266" y="403">Two kinds of signal needed;</text>
    <text x="266" y="418">top 5 by score; no model</text>
    <text x="266" y="438" opacity="0.8">Inferred, not verified</text>
  </g>

  <!-- Student path -->
  <rect x="484" y="310" width="216" height="150" rx="6" fill="none" stroke="#1f2b2d" stroke-opacity="0.35"/>
  <text x="498" y="331" font-size="13" font-weight="600" fill="#1f2b2d">Student path</text>
  <g font-size="11.5" fill="#1f2b2d">
    <text x="498" y="353">CV read by rule, contact</text>
    <text x="498" y="368">details blanked first</text>
    <text x="498" y="388">Rules: eligible, may be</text>
    <text x="498" y="403">eligible, or not eligible</text>
    <text x="498" y="423">Public fellowships and</text>
    <text x="498" y="438">sample scholarships</text>
  </g>

  <!-- skills and Scout -->
  <rect x="20" y="492" width="335" height="124" rx="6" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
  <text x="34" y="513" font-size="13" font-weight="600" fill="#1f2b2d">Writing skills · chat model</text>
  <g font-size="11.5" fill="#1f2b2d">
    <text x="34" y="534">1  Profile summary</text>
    <text x="34" y="552">2  Fit explanation for each lead</text>
    <text x="34" y="570">3  Hand-off opening, never sent</text>
    <text x="34" y="588">4  Cover-letter points for one record</text>
  </g>
  <rect x="365" y="492" width="335" height="124" rx="6" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
  <text x="379" y="513" font-size="13" font-weight="600" fill="#1f2b2d">Scout · agent, chat model</text>
  <g font-size="11.5" fill="#1f2b2d">
    <text x="379" y="534">Calls only Perch's own tools: ten for</text>
    <text x="379" y="552">researchers, eight for students</text>
    <text x="379" y="570">Cannot browse, send or change a record</text>
    <text x="379" y="588">Repeated calls are reused</text>
  </g>
  <g stroke="#1f2b2d" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M200 460 V490"/>
  </g>
  <g stroke="#a15c07" stroke-dasharray="4 3" fill="none" marker-end="url(#oa)" class="k-loop">
    <path d="M400 490 V462"/><path d="M592 490 V462"/>
  </g>
  <text x="410" y="480" font-size="11" fill="#1f2b2d" opacity="0.75">tools re-run the routes</text>

  <!-- validator -->
  <rect x="20" y="640" width="680" height="62" rx="6" fill="none" stroke="#1f2b2d" stroke-opacity="0.35"/>
  <text x="34" y="660" font-size="13" font-weight="600" fill="#1f2b2d">Validator · every model output</text>
  <rect x="34" y="668" width="320" height="24" rx="4" fill="none" stroke="#1f2b2d" stroke-opacity="0.45" class="k-code"/>
  <rect x="366" y="668" width="320" height="24" rx="4" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <g font-size="11.5" fill="#1f2b2d">
    <text x="44" y="684">1  Each id real; each number in a cited record</text>
    <text x="376" y="684">2  Clef checks each sentence against its record</text>
  </g>
  <g stroke="#1f2b2d" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M187 616 V638"/><path d="M532 616 V638"/>
  </g>

  <!-- API and web, user -->
  <rect x="200" y="734" width="500" height="70" rx="6" fill="none" stroke="#1f2b2d" stroke-opacity="0.45" class="k-code"/>
  <text x="214" y="755" font-size="13" font-weight="600" fill="#1f2b2d">API and web app · FastAPI, no-build web app</text>
  <g font-size="11.5" fill="#1f2b2d" opacity="0.85">
    <text x="214" y="775">Profile · Routes · Compare · Hand off · Ask Scout</text>
    <text x="214" y="793">Every claim opens its record in the evidence panel</text>
  </g>
  <rect x="20" y="734" width="150" height="70" rx="6" fill="none" stroke="#1f2b2d" stroke-opacity="0.35" stroke-dasharray="5 3"/>
  <text x="34" y="755" font-size="13" font-weight="600" fill="#1f2b2d">User</text>
  <g font-size="11.5" fill="#1f2b2d" opacity="0.85">
    <text x="34" y="775">keeps, dismisses, asks</text>
    <text x="34" y="793">the app sends nothing</text>
  </g>
  <path d="M360 702 V732" stroke="#1f2b2d" stroke-opacity="0.6" fill="none" marker-end="url(#oa)"/>
  <path d="M174 769 H196" stroke="#1f2b2d" stroke-opacity="0.6" fill="none" marker-start="url(#oa)" marker-end="url(#oa)"/>

  <!-- other ways in -->
  <g fill="none" stroke="#1f2b2d" stroke-opacity="0.45" class="k-code">
    <rect x="200" y="828" width="245" height="70" rx="6"/>
    <rect x="455" y="828" width="245" height="70" rx="6"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#1f2b2d">
    <text x="214" y="849">Local or Cloud choice</text>
    <text x="469" y="849">MCP server</text>
  </g>
  <g font-size="11.5" fill="#1f2b2d" opacity="0.85">
    <text x="214" y="868">Models are local by default.</text>
    <text x="214" y="883">Cloud only if you choose it</text>
    <text x="469" y="868">Scout's researcher tools for</text>
    <text x="469" y="883">any MCP client</text>
  </g>
</svg>
