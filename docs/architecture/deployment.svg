<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" class="arch" role="img" font-family="system-ui, sans-serif" aria-label="Two-GPU demo layout. GPU A holds Gemma and Clef-flash, which can be swapped for Sonnet through the Anthropic API with one line per role. GPU B holds Clef, the embedder and the reranker, which have no cloud path. In private mode the path to the API is refused.">
  <defs>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- server -->
  <rect x="20" y="20" width="410" height="350" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="36" y="44" font-size="13" font-weight="700" fill="currentColor">Perch server, two GPUs (deploy-2gpu)</text>

  <!-- GPU A -->
  <rect x="36" y="58" width="378" height="140" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="50" y="80" font-size="11" font-weight="600" letter-spacing="0.06em" fill="currentColor" opacity="0.7">GPU A · WRITING AND AGENT</text>
  <rect x="50" y="90" width="350" height="44" rx="6" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
  <text x="64" y="109" font-size="13" font-weight="600" fill="currentColor">Gemma 4 26B-A4B</text>
  <text x="64" y="125" font-size="11" fill="currentColor" opacity="0.75">summary, fit explanation, hand-off, Scout</text>
  <rect x="50" y="142" width="350" height="36" rx="6" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
  <text x="64" y="165" font-size="13" font-weight="600" fill="currentColor">Clef-flash <tspan font-size="11" font-weight="400" opacity="0.75">decide</tspan></text>
  <text x="400" y="192" font-size="11" fill="currentColor" opacity="0.75" text-anchor="end">26,683 MiB measured together</text>

  <!-- GPU B -->
  <rect x="36" y="210" width="378" height="140" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.3"/>
  <text x="50" y="232" font-size="11" font-weight="600" letter-spacing="0.06em" fill="currentColor" opacity="0.7">GPU B · SEARCH AND CHECKS</text>
  <rect x="50" y="242" width="350" height="36" rx="6" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <text x="64" y="265" font-size="13" font-weight="600" fill="currentColor">Clef <tspan font-size="11" font-weight="400" opacity="0.75">grounding check</tspan></text>
  <rect x="50" y="286" width="350" height="36" rx="6" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <text x="64" y="309" font-size="13" font-weight="600" fill="currentColor">Qwen3 embedder and reranker <tspan font-size="11" font-weight="400" opacity="0.75">search</tspan></text>
  <text x="400" y="342" font-size="11" fill="currentColor" opacity="0.75" text-anchor="end">19,000 + 3,256 MiB, measured apart</text>

  <!-- API -->
  <rect x="490" y="96" width="150" height="76" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="565" y="124" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Anthropic API</text>
  <text x="565" y="142" font-size="12" fill="currentColor" text-anchor="middle">claude-sonnet-5-5</text>
  <text x="565" y="160" font-size="11" fill="currentColor" opacity="0.75" text-anchor="middle">$100 cap in .env</text>

  <!-- swap arrows -->
  <g fill="none" stroke="#a15c07" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#da)" class="k-loop">
    <path d="M400 112 H488"/>
    <path d="M400 160 H444 V150 H488"/>
  </g>
  <text x="565" y="86" font-size="11" fill="currentColor" text-anchor="middle">one line per role in .env</text>
  <text x="565" y="196" font-size="11" fill="currentColor" opacity="0.75" text-anchor="middle">decide: no confidence</text>
  <text x="565" y="210" font-size="11" fill="currentColor" opacity="0.75" text-anchor="middle">score from the API</text>

  <!-- no cloud path for GPU B -->
  <text x="565" y="290" font-size="11" fill="currentColor" text-anchor="middle">no cloud path:</text>
  <text x="565" y="305" font-size="11" fill="currentColor" opacity="0.75" text-anchor="middle">no embedding or rerank API,</text>
  <text x="565" y="320" font-size="11" fill="currentColor" opacity="0.75" text-anchor="middle">no token scores for Clef's job</text>

  <!-- private mode -->
  <rect x="20" y="390" width="620" height="60" rx="8" fill="none" stroke="#b42323" stroke-opacity="0.8" class="k-private"/>
  <text x="36" y="414" font-size="13" font-weight="700" fill="currentColor">Private mode (designed, built in S13)</text>
  <text x="36" y="434" font-size="11" fill="currentColor" opacity="0.75">Every model must run on this server. A cloud role is an error, not a fallback.</text>
  <line x1="470" y1="420" x2="560" y2="420" stroke="currentColor" stroke-width="1.4" marker-end="url(#da)"/>
  <text x="600" y="424" font-size="11" fill="currentColor" text-anchor="middle">API</text>
  <g stroke="#b42323" stroke-width="2.2" class="k-private-x">
    <line x1="505" y1="410" x2="525" y2="430"/><line x1="525" y1="410" x2="505" y2="430"/>
  </g>
</svg>
