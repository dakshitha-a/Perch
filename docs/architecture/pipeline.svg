<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 940" class="arch" role="img" font-family="system-ui, sans-serif" aria-label="A brief runs eight steps top to bottom: fetch and eligibility are code, embed and rerank are local models, the profile summary and fit explanation are chat models that can move to Sonnet, the citation check is code, and the grounding check is Clef. A failed check sends the explanation back once. Hand-off, Scout and decide run later, on request.">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-size="12" fill="currentColor">
    <rect x="60" y="14" width="22" height="14" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code"/>
    <text x="90" y="25">code, no model</text>
    <rect x="210" y="14" width="22" height="14" rx="3" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
    <text x="240" y="25">local model, stays local</text>
    <rect x="410" y="14" width="22" height="14" rx="3" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
    <text x="440" y="25">local now, can move to Sonnet</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.7" font-weight="600" letter-spacing="0.06em">
    <text x="60" y="62">STEP</text>
    <text x="380" y="62">RUNS ON</text>
  </g>

  <!-- step boxes: x 60..340, rows every 72 from y 76 -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.35" class="k-step">
    <rect x="60" y="76" width="280" height="44" rx="6"/>
    <rect x="60" y="148" width="280" height="44" rx="6"/>
    <rect x="60" y="220" width="280" height="44" rx="6"/>
    <rect x="60" y="292" width="280" height="44" rx="6"/>
    <rect x="60" y="364" width="280" height="44" rx="6"/>
    <rect x="60" y="436" width="280" height="44" rx="6"/>
    <rect x="60" y="508" width="280" height="44" rx="6"/>
    <rect x="60" y="580" width="280" height="44" rx="6"/>
    <rect x="60" y="730" width="280" height="44" rx="6"/>
    <rect x="60" y="802" width="280" height="44" rx="6"/>
    <rect x="60" y="874" width="280" height="44" rx="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="currentColor">
    <text x="76" y="103">1  Fetch records</text>
    <text x="76" y="175">2  Eligibility and dates</text>
    <text x="76" y="247">3  Embed topics and calls</text>
    <text x="76" y="319">4  Rerank candidates</text>
    <text x="76" y="391">5  Profile summary (skill 1)</text>
    <text x="76" y="463">6  Fit explanation (skill 2)</text>
    <text x="76" y="535">7  Citation check (validator 1)</text>
    <text x="76" y="607">8  Grounding check (validator 2)</text>
    <text x="76" y="757">Hand-off draft (skill 3, S12)</text>
    <text x="76" y="829">Scout agent (S10)</text>
    <text x="76" y="901">Decide (typed yes or no)</text>
  </g>

  <!-- runs-on boxes: x 380..640 -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code">
    <rect x="380" y="76" width="260" height="44" rx="6"/>
    <rect x="380" y="148" width="260" height="44" rx="6"/>
    <rect x="380" y="508" width="260" height="44" rx="6"/>
  </g>
  <g fill="#dcefe8" stroke="#1f6f5c" class="k-local">
    <rect x="380" y="220" width="260" height="44" rx="6"/>
    <rect x="380" y="292" width="260" height="44" rx="6"/>
    <rect x="380" y="580" width="260" height="44" rx="6"/>
  </g>
  <g fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud">
    <rect x="380" y="364" width="260" height="44" rx="6"/>
    <rect x="380" y="436" width="260" height="44" rx="6"/>
    <rect x="380" y="730" width="260" height="44" rx="6"/>
    <rect x="380" y="802" width="260" height="44" rx="6"/>
    <rect x="380" y="874" width="260" height="44" rx="6"/>
  </g>
  <g fill="currentColor">
    <g font-size="13" font-weight="600">
      <text x="394" y="96">Public APIs</text>
      <text x="394" y="168">Fixed rules on record fields</text>
      <text x="394" y="240">Qwen3-Embedding-0.6B</text>
      <text x="394" y="312">Qwen3-Reranker-0.6B</text>
      <text x="394" y="384">Gemma 4 26B-A4B</text>
      <text x="394" y="456">Gemma 4 26B-A4B</text>
      <text x="394" y="528">Plain code</text>
      <text x="394" y="600">Clef</text>
      <text x="394" y="750">Gemma 4 26B-A4B</text>
      <text x="394" y="822">Gemma 4 26B-A4B</text>
      <text x="394" y="894">Clef-flash</text>
    </g>
    <g font-size="11" opacity="0.75">
      <text x="394" y="112">OpenAlex, RePORTER, Grants.gov</text>
      <text x="394" y="184">numbers and dates copied, never written</text>
      <text x="394" y="256">no cloud adapter</text>
      <text x="394" y="328">no cloud adapter</text>
      <text x="394" y="400">or Sonnet: one line in .env</text>
      <text x="394" y="472">or Sonnet: 24 of 30 passed, $0.09 a brief</text>
      <text x="394" y="544">every citation is a real record</text>
      <text x="394" y="616">needs token scores; Anthropic has none</text>
      <text x="394" y="766">or Sonnet</text>
      <text x="394" y="838">or Sonnet, allowlisted tools only</text>
      <text x="394" y="910">or Sonnet, without a confidence score</text>
    </g>
  </g>

  <!-- step to runs-on ticks -->
  <g stroke="currentColor" stroke-opacity="0.35">
    <line x1="340" y1="98" x2="380" y2="98"/><line x1="340" y1="170" x2="380" y2="170"/>
    <line x1="340" y1="242" x2="380" y2="242"/><line x1="340" y1="314" x2="380" y2="314"/>
    <line x1="340" y1="386" x2="380" y2="386"/><line x1="340" y1="458" x2="380" y2="458"/>
    <line x1="340" y1="530" x2="380" y2="530"/><line x1="340" y1="602" x2="380" y2="602"/>
    <line x1="340" y1="752" x2="380" y2="752"/><line x1="340" y1="824" x2="380" y2="824"/>
    <line x1="340" y1="896" x2="380" y2="896"/>
  </g>

  <!-- flow arrows with what moves -->
  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#pa)">
    <line x1="200" y1="120" x2="200" y2="146"/><line x1="200" y1="192" x2="200" y2="218"/>
    <line x1="200" y1="264" x2="200" y2="290"/><line x1="200" y1="336" x2="200" y2="362"/>
    <line x1="200" y1="408" x2="200" y2="434"/><line x1="200" y1="480" x2="200" y2="506"/>
    <line x1="200" y1="552" x2="200" y2="578"/><line x1="200" y1="624" x2="200" y2="650"/>
    <line x1="200" y1="684" x2="200" y2="728"/>
    <line x1="200" y1="846" x2="200" y2="872"/>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.75">
    <text x="210" y="138">papers, awards, calls</text>
    <text x="210" y="210">eligible calls only</text>
    <text x="210" y="282">nearest candidates</text>
    <text x="210" y="354">top leads</text>
    <text x="210" y="426">profile and leads</text>
    <text x="210" y="498">text with citations</text>
    <text x="210" y="570">citations checked</text>
    <text x="210" y="642">supported sentences</text>
    <text x="210" y="712">kept leads</text>
    <text x="210" y="864">typed questions</text>
  </g>

  <!-- validator loop back to step 6 -->
  <path d="M60 602 H36 V458 H58" fill="none" stroke="#a15c07" stroke-width="1.4" marker-end="url(#pa)" class="k-loop"/>
  <path d="M60 530 H36" fill="none" stroke="#a15c07" stroke-width="1.4" class="k-loop"/>
  <text x="24" y="530" font-size="11" fill="currentColor" text-anchor="middle" transform="rotate(-90 24 530)">fails: rewrite once, then flag</text>

  <!-- output -->
  <rect x="130" y="652" width="140" height="32" rx="16" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="200" y="673" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Leads on screen</text>

  <line x1="20" y1="700" x2="640" y2="700" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="2 4"/>
  <text x="640" y="718" font-size="11" fill="currentColor" opacity="0.7" text-anchor="end" font-weight="600" letter-spacing="0.06em">AFTER THE BRIEF, ON REQUEST</text>
</svg>
