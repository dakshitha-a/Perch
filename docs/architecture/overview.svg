<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" class="arch" role="img" font-family="system-ui, sans-serif" aria-label="How Perch fits together. Public sources feed plain-code fetchers, which store every record with its provenance. A brief runs two routes from the store: grants, which uses two small local models and eligibility rules, and industry leads, which is code only. A chat model writes the profile summary, the fit explanations and the hand-off draft, and Scout answers follow-ups by calling only Perch's own tools. Every model output passes the validator before the API and web app show it to the researcher. Private mode runs the same pipeline on self-hosted models and writes nothing; the MCP server offers Scout's tools to other agents.">
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-size="12" fill="currentColor">
    <rect x="20" y="12" width="22" height="14" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code"/>
    <text x="48" y="23">code, no model</text>
    <rect x="160" y="12" width="22" height="14" rx="3" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
    <text x="188" y="23">local model, stays local</text>
    <rect x="345" y="12" width="22" height="14" rx="3" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
    <text x="373" y="23">chat model, can move to Sonnet</text>
    <rect x="590" y="12" width="22" height="14" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="2 3"/>
    <text x="618" y="23">unavailable</text>
  </g>

  <g font-size="11" fill="currentColor" opacity="0.7" font-weight="600" letter-spacing="0.06em">
    <text x="20" y="58">PUBLIC SOURCES · READ ONLY</text>
    <text x="20" y="300">A BRIEF · TWO ROUTES</text>
    <text x="20" y="444">MODELS · BOUNDED</text>
    <text x="20" y="666">WHAT THE RESEARCHER SEES</text>
  </g>

  <!-- sources -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="5 3">
    <rect x="20" y="68" width="128" height="52" rx="6"/>
    <rect x="158" y="68" width="128" height="52" rx="6"/>
    <rect x="296" y="68" width="128" height="52" rx="6"/>
    <rect x="434" y="68" width="128" height="52" rx="6"/>
  </g>
  <rect x="572" y="68" width="128" height="52" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="2 3"/>
  <g font-size="13" font-weight="600" fill="currentColor">
    <text x="30" y="90">OpenAlex</text>
    <text x="168" y="90">NIH RePORTER</text>
    <text x="306" y="90">NSF Awards</text>
    <text x="444" y="90">Grants.gov</text>
    <text x="582" y="90" opacity="0.55">SBIR.gov</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.75">
    <text x="30" y="108">papers, companies</text>
    <text x="168" y="108">awards, SBIR/STTR</text>
    <text x="306" y="108">awards, dates</text>
    <text x="444" y="108">open, archived calls</text>
    <text x="582" y="108" opacity="0.7">API down, unused</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M84 120 V148"/><path d="M222 120 V148"/><path d="M360 120 V148"/><path d="M498 120 V148"/>
  </g>

  <!-- fetchers and store -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code">
    <rect x="20" y="150" width="680" height="50" rx="6"/>
    <rect x="20" y="226" width="680" height="50" rx="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="currentColor">
    <text x="36" y="171">Fetchers</text>
    <text x="36" y="247">Store · SQLite records and a LanceDB search index</text>
  </g>
  <g font-size="11.5" fill="currentColor" opacity="0.8">
    <text x="36" y="189">Rate-limited and retried. Each record keeps its source, link and fetch time. Numbers are copied.</text>
    <text x="36" y="265">Researchers, works, awards, opportunities, organisations, leads and briefs; embedding and rerank caches.</text>
  </g>
  <path d="M360 200 V224" stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)"/>
  <g stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M187 276 V308"/><path d="M532 276 V308"/>
  </g>

  <!-- Route A -->
  <rect x="20" y="310" width="335" height="112" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="34" y="331" font-size="13" font-weight="600" fill="currentColor">Route A · grants</text>
  <rect x="34" y="340" width="307" height="22" rx="4" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <rect x="34" y="366" width="307" height="22" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code"/>
  <rect x="34" y="392" width="307" height="22" rx="4" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <g font-size="11.5" fill="currentColor">
    <text x="44" y="355">Embed papers into threads; search calls</text>
    <text x="44" y="381">Eligibility rules on record fields</text>
    <text x="44" y="407">Rerank the best 50 to a top 10</text>
  </g>

  <!-- Route B -->
  <rect x="365" y="310" width="335" height="112" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code"/>
  <text x="379" y="331" font-size="13" font-weight="600" fill="currentColor">Route B · industry leads, no model</text>
  <g font-size="11.5" fill="currentColor">
    <text x="379" y="353">Signals per company: works citing the papers,</text>
    <text x="379" y="370">NIH SBIR/STTR awards, works in the same topics</text>
    <text x="379" y="392">Two kinds of signal needed; top 5 by score</text>
    <text x="379" y="410" opacity="0.8">Every lead: inferred from public signals; not verified</text>
  </g>

  <!-- skills and Scout -->
  <rect x="20" y="454" width="335" height="104" rx="6" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
  <text x="34" y="475" font-size="13" font-weight="600" fill="currentColor">Writing skills · chat model</text>
  <g font-size="11.5" fill="currentColor">
    <text x="34" y="496">1  Profile summary</text>
    <text x="34" y="516">2  Fit explanation for each grant lead</text>
    <text x="34" y="536">3  Hand-off draft, never sent</text>
  </g>
  <rect x="365" y="454" width="335" height="104" rx="6" fill="#f6ead8" stroke="#a15c07" stroke-dasharray="4 3" class="k-cloud"/>
  <text x="379" y="475" font-size="13" font-weight="600" fill="currentColor">Scout · agent, chat model</text>
  <g font-size="11.5" fill="currentColor">
    <text x="379" y="496">Calls only Perch's nine tools: search,</text>
    <text x="379" y="513">industry signals, records, profile, awards</text>
    <text x="379" y="535">Asks before each step; repeats are reused</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M187 422 V452"/>
  </g>
  <path d="M532 452 V424" stroke="#a15c07" stroke-dasharray="4 3" fill="none" marker-end="url(#oa)" class="k-loop"/>
  <text x="540" y="442" font-size="11" fill="currentColor" opacity="0.75">tools re-run both routes</text>

  <!-- validator -->
  <rect x="20" y="582" width="680" height="62" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="34" y="602" font-size="13" font-weight="600" fill="currentColor">Validator · every model output</text>
  <rect x="34" y="610" width="320" height="24" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code"/>
  <rect x="366" y="610" width="320" height="24" rx="4" fill="#dcefe8" stroke="#1f6f5c" class="k-local"/>
  <g font-size="11.5" fill="currentColor">
    <text x="44" y="626">1  Each id real; each number in a cited record</text>
    <text x="376" y="626">2  Clef checks each sentence against its record</text>
  </g>
  <g stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)">
    <path d="M187 558 V580"/><path d="M532 558 V580"/>
  </g>

  <!-- API and web, user -->
  <rect x="200" y="676" width="500" height="70" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code"/>
  <text x="214" y="697" font-size="13" font-weight="600" fill="currentColor">API and web app · FastAPI, no-build web app</text>
  <g font-size="11.5" fill="currentColor" opacity="0.85">
    <text x="214" y="717">Profile · Routes · Compare · Hand off · Ask Scout</text>
    <text x="214" y="735">Every claim opens its record in the evidence panel</text>
  </g>
  <rect x="20" y="676" width="150" height="70" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="5 3"/>
  <text x="34" y="697" font-size="13" font-weight="600" fill="currentColor">Researcher</text>
  <g font-size="11.5" fill="currentColor" opacity="0.85">
    <text x="34" y="717">keeps, dismisses, asks</text>
    <text x="34" y="735">the app sends nothing</text>
  </g>
  <path d="M360 644 V674" stroke="currentColor" stroke-opacity="0.6" fill="none" marker-end="url(#oa)"/>
  <path d="M174 711 H196" stroke="currentColor" stroke-opacity="0.6" fill="none" marker-start="url(#oa)" marker-end="url(#oa)"/>

  <!-- other ways in -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.45" class="k-code">
    <rect x="200" y="770" width="245" height="58" rx="6"/>
    <rect x="455" y="770" width="245" height="58" rx="6"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="currentColor">
    <text x="214" y="791">Private mode</text>
    <text x="469" y="791">MCP server</text>
  </g>
  <g font-size="11.5" fill="currentColor" opacity="0.85">
    <text x="214" y="811">self-hosted models only; writes nothing</text>
    <text x="469" y="811">Scout's tools for any MCP client</text>
  </g>
</svg>
