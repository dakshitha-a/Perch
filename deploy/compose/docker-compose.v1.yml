# Perch v1 stack (ARCHITECTURE_V1 section 1.1), development ports. The live fallback demo
# is the separate root docker-compose.yml on 8090; this file never touches it.
#
#   make v1-up      start the stack (needs a .env; see .env.example)
#   make v1-down    stop it, keeping the volumes
#
# Every host port is bound to 127.0.0.1. Passwords and keys come from the environment
# (.env), never from this file.
#
# The worker runs on one GPU (the `worker-gpu` image, profile cloud-gpu), chosen by
# PERCH_WORKER_GPU (default 3). On a host without a GPU add the CPU override:
#   docker compose -f deploy/compose/docker-compose.v1.yml -f deploy/compose/docker-compose.cpu.yml ...
#
# Backups: the `backup` service dumps `perch` and `perch_keys` every day into separate
# volumes and deletes dumps older than 35 days (backup.sh). Restore check:
# restore_test.sh. A real restore follows docs/deploy.md section 9: `perch restore-mark` first,
# and the worker reconciles shreds at start before the web serves account routes again.
#
# The shred ledger (one file per deleted user) sits on its own volume, `shred-ledger`, apart
# from the database and backup volumes, so a restore of both databases cannot revert it. Web
# and worker refuse to start without it (S48 M3).
name: perch-v1

x-app-env: &app-env
  PERCH_ENV: dev
  PERCH_DB_POOL_MAX: "10"
  PERCH_REDIS_URL: redis://redis:6379/0
  PERCH_KEYSTORE: env
  PERCH_MASTER_KEY: ${PERCH_MASTER_KEY:?set PERCH_MASTER_KEY in .env}
  PERCH_MASTER_KEY_ID: ${PERCH_MASTER_KEY_ID:-m1}
  PERCH_KEYS_DATABASE_URL: postgresql://perch_keys:${PERCH_KEYS_PASSWORD:?set}@postgres:5432/perch_keys
  PERCH_PUBLIC_URL: http://127.0.0.1:8190
  PERCH_COOKIE_INSECURE: "1"
  PERCH_LOG_FORMAT: ${PERCH_LOG_FORMAT:-json}
  PERCH_SHRED_LEDGER_URI: /var/lib/perch/shred-ledger

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: perch
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      # Read by the realm import as ${PERCH_OIDC_CLIENT_SECRET}.
      PERCH_OIDC_CLIENT_SECRET: ${PERCH_OIDC_CLIENT_SECRET:?set PERCH_OIDC_CLIENT_SECRET in .env}
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./keycloak/perch-realm.json:/opt/keycloak/data/import/perch-realm.json:ro
      - kcdata:/opt/keycloak/data/h2
    healthcheck:
      # The image has no curl; open the port from bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/perch HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  migrate:
    build: &web-build
      context: ../..
      dockerfile: deploy/compose/Dockerfile.v1
      target: web
    image: perch-v1-web
    command: ["/opt/venv/bin/python", "/app/deploy/compose/migrate.py"]
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/perch
      ADMIN_KEYS_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/perch_keys
      PERCH_OWNER_PASSWORD: ${PERCH_OWNER_PASSWORD:?set PERCH_OWNER_PASSWORD in .env}
      PERCH_WEB_PASSWORD: ${PERCH_WEB_PASSWORD:?set PERCH_WEB_PASSWORD in .env}
      PERCH_WORKER_PASSWORD: ${PERCH_WORKER_PASSWORD:?set PERCH_WORKER_PASSWORD in .env}
      PERCH_KEYS_PASSWORD: ${PERCH_KEYS_PASSWORD:?set PERCH_KEYS_PASSWORD in .env}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  web:
    build: *web-build
    image: perch-v1-web
    environment:
      <<: *app-env
      PERCH_DATABASE_URL: postgresql://perch_web:${PERCH_WEB_PASSWORD}@postgres:5432/perch
      PERCH_AUTH_PROVIDER: oidc
      PERCH_OIDC_ISSUER: http://keycloak:8080/realms/perch
      PERCH_OIDC_CLIENT_ID: perch-web
      PERCH_OIDC_CLIENT_SECRET: ${PERCH_OIDC_CLIENT_SECRET}
      PERCH_PEPPER: ${PERCH_PEPPER:?set PERCH_PEPPER in .env (openssl rand -base64 32)}
      PERCH_PEPPER_GUEST: ${PERCH_PEPPER_GUEST:?set PERCH_PEPPER_GUEST in .env (openssl rand -base64 32)}
      # S48 S2: the reverse proxy runs on the host and reaches the web through the published
      # port, so every request arrives from this network's gateway. X-Forwarded-For counts
      # only when the peer is that gateway (perch/redisx.py client_addr), so per-address
      # limits see each visitor instead of one bucket. Keep it in step with networks below.
      PERCH_TRUSTED_PROXIES: ${PERCH_TRUSTED_PROXIES:-172.29.190.1/32}
    ports: ["127.0.0.1:8190:8000"]
    volumes:
      - shred-ledger:/var/lib/perch/shred-ledger
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.v1
      target: worker-gpu
    image: perch-v1-worker:gpu
    environment:
      <<: *app-env
      PERCH_PROFILE: cloud-gpu
      PERCH_DATABASE_URL: postgresql://perch_worker:${PERCH_WORKER_PASSWORD}@postgres:5432/perch
      PERCH_DATABASE_DIRECT_URL: postgresql://perch_worker:${PERCH_WORKER_PASSWORD}@postgres:5432/perch
      PERCH_TORCH_THREADS: ${PERCH_TORCH_THREADS:-4}
      PERCH_WORKER_CONCURRENCY: ${PERCH_WORKER_CONCURRENCY:-16}
      PERCH_AUDIT_KEY: ${PERCH_AUDIT_KEY:?set PERCH_AUDIT_KEY in .env (openssl rand -base64 32)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The adapter's own spend file (perch/llm/budget.py), on a named volume so recreating
      # the container keeps the running total (S48 M2). Only the worker calls a paid model.
      PERCH_SPEND_LEDGER: /var/lib/perch/spend/anthropic_spend.jsonl
    volumes:
      - spend:/var/lib/perch/spend
      - shred-ledger:/var/lib/perch/shred-ledger
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PERCH_WORKER_GPU:-3}"]
              capabilities: [gpu]
    healthcheck:
      # True when this container's worker_heartbeat row is under 90 seconds old.
      test: ["CMD", "/opt/venv/bin/perch", "worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  backup:
    image: pgvector/pgvector:0.8.0-pg16
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_KEYS_DIR: /backups-keys
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - backups-keys:/backups-keys
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # The loop touches the file after every run, so it is under 25 hours old.
      test: ["CMD-SHELL", "find /tmp/backup-heartbeat -mmin -1500 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 5m
    restart: unless-stopped

volumes:
  shred-ledger:
  spend:
  backups:
  backups-keys:
  pgdata:
  redisdata:
  kcdata:

# A fixed subnet, so the gateway the web trusts for X-Forwarded-For (PERCH_TRUSTED_PROXIES
# above) is known. Chosen away from Docker's defaults; change both together if it clashes.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.190.0/24
          gateway: 172.29.190.1
