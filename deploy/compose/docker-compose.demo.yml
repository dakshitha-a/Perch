# `make demo`: the v1 stack as its own Compose project (perch-demo), added on top of
# docker-compose.v1.yml (and docker-compose.cpu.yml unless GPU=1). It never touches the
# perch-v1 project: other host ports, another subnet, other image names, its own volumes.
#
#   make demo         build, start, load the Temple dataset, wait for /health, print the URL
#   make demo-down    stop and remove the perch-demo containers; volumes are kept
#   make demo-clean   the same, and remove its volumes
#
# Secrets come from .env.demo, generated by `make demo` with dev-only random values.
# Ports default to web 8300, Postgres 5434, Redis 6381, Keycloak 8181 on 127.0.0.1;
# set DEMO_WEB_PORT, DEMO_PG_PORT, DEMO_REDIS_PORT, DEMO_KC_PORT to change them.
services:
  postgres:
    ports: !override ["127.0.0.1:${DEMO_PG_PORT:-5434}:5432"]

  redis:
    ports: !override ["127.0.0.1:${DEMO_REDIS_PORT:-6381}:6379"]

  keycloak:
    ports: !override ["127.0.0.1:${DEMO_KC_PORT:-8181}:8080"]
    # The v1 file mounts the volume at data/h2, which the image does not have, so Docker
    # creates it owned by root and Keycloak (uid 1000) cannot write its database. Mounted
    # at data/, the new volume is filled from the image with the image's ownership.
    volumes: !override
      - kcdata:/opt/keycloak/data
      - ./keycloak/perch-realm.json:/opt/keycloak/data/import/perch-realm.json:ro
    # Keycloak 26.0 answers a request without a Host header with a 500, so the v1 file's
    # HTTP/1.0 check never passes; this one sends the header.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/perch HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]

  migrate:
    image: perch-demo-v1-web

  web:
    image: perch-demo-v1-web
    environment:
      PERCH_PUBLIC_URL: http://127.0.0.1:${DEMO_WEB_PORT:-8300}
      PERCH_TRUSTED_PROXIES: 172.29.191.1/32
    ports: !override ["127.0.0.1:${DEMO_WEB_PORT:-8300}:8000"]

  worker:
    image: perch-demo-v1-worker:${DEMO_WORKER_TAG:-cpu}
    environment:
      PERCH_PUBLIC_URL: http://127.0.0.1:${DEMO_WEB_PORT:-8300}
      PERCH_WORKER_CONCURRENCY: ${PERCH_WORKER_CONCURRENCY:-2}
      PERCH_TORCH_THREADS: ${PERCH_TORCH_THREADS:-2}

  # One-shot: load the committed public Temple awards dataset (idempotent).
  # `docker compose ... run --rm --no-deps seed`; not started by `up`.
  seed:
    image: perch-demo-v1-web
    profiles: [seed]
    command: ["/opt/venv/bin/perch", "temple", "load-dataset",
              "/seed/${DEMO_DATASET:-temple_awards_v3.jsonl}",
              "--dsn", "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/perch"]
    volumes:
      - ../../data/temple/dataset:/seed:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

networks:
  default:
    ipam:
      config: !override
        - subnet: 172.29.191.0/24
          gateway: 172.29.191.1
