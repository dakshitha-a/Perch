# Perch demo, hybrid deployment (S9): this file runs the app; the models run on the host
# as systemd user units on two GPUs (`make demo` starts both). Host networking lets the
# app reach the model ports on 127.0.0.1 and keeps the app itself on 127.0.0.1:8090,
# where the tunnel picks it up.
services:
  perch:
    build: .
    image: perch-demo
    network_mode: host
    user: "${PERCH_UID:-1000}:${PERCH_GID:-1000}"
    # Hardening (review S18): no Linux capabilities (the port is above 1024), no privilege
    # gain, and a read-only root file system; the app writes only to ./data and /tmp.
    # read_only is first started at the S32 rebuild: check the container comes up.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    env_file:
      - path: .env
        required: false
    environment:
      PERCH_PROFILE: deploy-2gpu
      PERCH_DB: /app/data/demo/perch.db
      PERCH_SAMPLE_DB: /app/data/demo/sample.db  # SYNTHETIC scholarships, student mode only
      PERCH_MODEL_SERVER: http://127.0.0.1:8093
      OLLAMA_BASE_URL: http://127.0.0.1:11437
      PERCH_CLEF_URL: http://127.0.0.1:8094
      PERCH_CLEF_FLASH_URL: http://127.0.0.1:8095
      # Every brief is a session held in memory (S23). Every model above is on loopback,
      # and Tailscale Funnel decrypts on this node, so TLS ends on the server.
      PERCH_PRIVATE_MODE: "1"
      PERCH_TLS_AT: server
      PERCH_PRIVATE_OPERATOR: Dakshitha, Temple University
      # Cloud by choice (S23): a visitor may turn it on for a brief with no documents.
      # The key comes from .env; the adapter's $100 cap and this daily cap both apply.
      PERCH_CLOUD: anthropic:claude-sonnet-5-5
      PERCH_CLOUD_BRIEFS_PER_DAY: "30"
      # Warm demo briefs (S24, Q31): built at start and held in memory, never on disk.
      # PI-5, PI-4 and PI-2, the demo researchers.
      PERCH_WARM_AUTHORS: A5034175589,A5026494099,A5057472361
    volumes:
      - ./data:/app/data
    restart: unless-stopped
